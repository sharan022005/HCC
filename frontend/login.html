<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCC Admin Login</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="static/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
        }
        
        .auth-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-logo {
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(67, 24, 255, 0.1) 0%, rgba(134, 92, 255, 0.1) 100%);
            border: 1px solid rgba(67, 24, 255, 0.2);
        }

        .auth-logo i {
            font-size: 32px;
            color: var(--primary-color);
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .auth-container p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(67, 24, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.1);
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 10px;
        }

        .toggle-auth {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .toggle-auth a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .toggle-auth a:hover {
            text-decoration: underline;
        }
        
        .error-msg {
            color: var(--danger-color);
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        
        #register-form {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-logo">
            <i class="ph ph-shield-check"></i>
        </div>
        
        <div id="login-form">
            <h2>Admin Login</h2>
            <p>Enter your credentials to access the dashboard</p>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="admin@hcc.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary btn-full" id="login-btn" onclick="handleLogin()">Sign In</button>
            
            <div class="error-msg" id="login-error"></div>
            
            <div class="toggle-auth">
                Don't have an account? <a onclick="toggleForms()">Register here</a>
            </div>
        </div>
        
        <div id="register-form">
            <h2>Create Account</h2>
            <p>Register a new admin account</p>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="admin@hcc.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary btn-full" id="reg-btn" onclick="handleRegister()">Create Account</button>
            
            <div class="error-msg" id="reg-error"></div>
            
            <div class="toggle-auth">
                Already have an account? <a onclick="toggleForms()">Sign in</a>
            </div>
        </div>
    </div>

    <script src="static/login.js"></script>
</body>
</html>
